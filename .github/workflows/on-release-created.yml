name: Publish EgoKey compatibility SDK (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type publish-compatibility-sdk to publish the legacy cherrypick-js package"
        required: true
        type: string

jobs:
  publish-egokey-compatibility-sdk:
    name: Publish compatibility SDK
    if: inputs.confirmation == 'publish-compatibility-sdk'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6.0.1
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
      - name: Use Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          # see https://docs.github.com/actions/use-cases-and-examples/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
          registry-url: 'https://registry.npmjs.org'
      - name: Publish package
        run: |
          pnpm i --frozen-lockfile
          pnpm build
          pnpm --filter cherrypick-js publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
