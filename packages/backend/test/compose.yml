services:
  redistest:
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - misskey-test-redis
    ports:
      - "127.0.0.1:56312:6379"

  dbtest:
    image: postgres:15
    ports:
      - "127.0.0.1:54312:5432"
    environment:
      POSTGRES_DB: misskey_test
      POSTGRES_USER: misskey_test
      POSTGRES_PASSWORD: misskey-test-password
