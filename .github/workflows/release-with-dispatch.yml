name: EgoKey release checklist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 4.18.0-egokey.0)"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Check version metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(jq -r '.version' package.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.version' packages/cherrypick-js/package.json)" = "$RELEASE_VERSION"
      - name: Release instructions
        run: |
          echo "Version metadata is ready. Create the GitHub Release from main with the requested prerelease setting."
          echo "A published GitHub Release builds ghcr.io/anxrch/egokey."
          echo "The legacy cherrypick-js package is never published automatically."
