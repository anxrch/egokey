name: EgoKey release notes check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Confirm EgoKey changelog exists
        run: test -s CHANGELOG_EGOKEY.md
      - name: Explain release policy
        run: |
          echo "Release notes are maintained in CHANGELOG_EGOKEY.md."
          echo "Create the GitHub Release manually after deployment and verification."
